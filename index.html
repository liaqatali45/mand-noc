<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mand Border Market NOC</title>
<meta name="description" content="Import and export NOC / gate pass system - Mand Border Market, Industries & Commerce Department, Government of Balochistan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Mand Border Market - NOC / Gate Pass System
   ===================================================================== */
:root{
  --pine:#0A3626; --pine-2:#0F4A34; --green:#0F6B45; --green-dark:#0A5034; --green-tint:#E4F1EA; --green-line:#B8D7C5;
  --brass:#C29B3A; --brass-tint:#F7EFD9;
  --ink:#15211B; --muted:#5A6862; --faint:#8A9690; --line:#DDE4E0; --bg:#F2F5F3; --paper:#FFFFFF; --soft:#F7F9F8;
  --red:#A62B22; --red-tint:#FBEAE8; --amber:#8C5A00; --amber-tint:#FCF1DB; --blue:#1C4C82; --blue-tint:#E5EDF7;
  --head:'Archivo','Segoe UI',Arial,sans-serif; --body:'Source Sans 3','Segoe UI',Arial,sans-serif;
  --r:10px; --r-sm:6px;
  --stripe:repeating-linear-gradient(135deg,var(--brass) 0 10px,var(--pine) 10px 20px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15;letter-spacing:-.015em}
h1{font-size:1.8rem;font-weight:800} h2{font-size:1.2rem;font-weight:700} h3{font-size:1rem;font-weight:700}
:focus-visible{outline:3px solid #2E7FE8;outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:.88rem} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .spacer{flex:1}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:#EEF2F0}
.sb{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0B3A29 0%,#08301F 100%);color:#DCE8E1;display:flex;flex-direction:column;z-index:50}
.sb-brand{display:flex;align-items:center;gap:12px;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .em{width:50px;height:50px;border-radius:12px;background:#fff;padding:4px;flex:none;display:grid;place-items:center}
.sb-brand .em img{width:100%;height:100%;object-fit:contain}
.sb-brand b{display:block;font-family:var(--head);font-weight:800;font-size:1.05rem;color:#fff;line-height:1.15}
.sb-brand span{display:block;font-size:.78rem;color:rgba(255,255,255,.6);margin-top:2px}
.sb .nav{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:2px}
.sb .nav .grp{font-size:.72rem;color:rgba(255,255,255,.4);padding:14px 12px 6px;font-weight:700;letter-spacing:.02em}
.sb .nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;color:rgba(255,255,255,.76);font-weight:600;text-align:left;position:relative;transition:background .15s,color .15s}
.sb .nav button svg{width:19px;height:19px;flex:none;opacity:.8}
.sb .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.sb .nav button[aria-current="page"]{background:#fff;color:var(--pine);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.sb .nav button[aria-current="page"] svg{opacity:1;color:var(--green)}
.badge{margin-left:auto;background:var(--brass);color:var(--pine);border-radius:99px;font-size:.74rem;font-weight:800;min-width:22px;padding:1px 7px;text-align:center}
.sb-user{margin:0 12px 14px;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.sb-user .av{width:36px;height:36px;border-radius:50%;background:var(--brass);color:var(--pine);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:.85rem;flex:none}
.sb-user b{display:block;color:#fff;font-size:.9rem;line-height:1.2}
.sb-user span{font-size:.76rem;color:rgba(255,255,255,.6)}
.sb-user button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap}
.sb-user button:hover{background:rgba(255,255,255,.1)}
.col{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px clamp(14px,2.4vw,30px)}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:42px;height:42px;cursor:pointer;color:var(--ink);flex:none}
.hamb svg{width:22px;height:22px}
.gsearch{position:relative;flex:1;max-width:560px}
.gsearch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.gsearch input[type=search]{padding-left:42px;padding-right:40px;background:var(--soft);border-color:var(--line);border-radius:10px}
.gsearch input[type=search]:focus{background:#fff}
.gsearch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 .72rem var(--body);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:#fff}
.gsearch input:not(:placeholder-shown) ~ kbd{display:none}
.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(10,40,25,.18);overflow:hidden;max-height:70vh;overflow-y:auto}
.gres button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer}
.gres button:hover,.gres button.on{background:var(--green-tint)}
.gres .r1{font-family:var(--head);font-weight:700}
.gres .r2{grid-column:1;font-size:.86rem;color:var(--muted)}
.gres .r3{grid-row:1/3;grid-column:2;align-self:center}
.gres .all{display:block;text-align:center;color:var(--green);font-weight:700;padding:10px;border:0}
.gres .none{padding:16px;color:var(--muted);text-align:center}
.top-gov{margin-left:auto;display:flex;align-items:center;gap:12px;text-align:right}
.top-gov img{width:42px;height:auto}
.top-gov b{display:block;font-family:var(--head);font-size:.92rem;color:var(--pine);line-height:1.2}
.top-gov span{display:block;font-size:.78rem;color:var(--muted)}
.top-gov .ur{font-family:'Noto Nastaliq Urdu',serif;font-size:1.05rem;color:var(--pine);line-height:1.9;padding-left:12px;border-left:1px solid var(--line)}
main{flex:1;padding:26px clamp(14px,2.4vw,30px) 40px;min-width:0;width:100%;max-width:1360px}
.app-foot{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:.82rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;padding:14px clamp(14px,2.4vw,30px)}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.head h1{color:var(--pine)}
.head p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.head .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.scrim{display:none}
.top-id{display:flex;align-items:center;gap:12px;min-width:0}
.top-id img{width:42px;height:auto;flex:none}
.top-id b{display:block;font-family:var(--head);font-size:1.02rem;color:var(--pine);line-height:1.2}
.top-id span{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ur{margin-left:auto;font-family:'Noto Nastaliq Urdu',serif;font-size:1.18rem;color:var(--pine);line-height:1.9;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.lbar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.lbar .gsearch{flex:1;min-width:220px;max-width:none}
.lbar .cnt{color:var(--muted);font-size:.9rem;white-space:nowrap}
.prow{display:grid;grid-template-columns:minmax(220px,1fr) 170px 170px 160px;gap:10px 12px;align-items:end}
.prow .gsearch{max-width:none}
@media (max-width:760px){.prow{grid-template-columns:1fr 1fr}.prow .grow{grid-column:1/-1}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:0 20px 20px}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.pick button:hover{border-color:var(--green);background:var(--green-tint)}
.pick button span{font-size:.86rem;color:var(--muted)}
.pick .chip{margin:4px 0 0;font-style:normal}
.party-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.party-card .shop{font-family:var(--head);font-weight:800;font-size:1.5rem;color:var(--green-dark);background:var(--green-tint);border-radius:10px;padding:12px 16px;text-align:center;line-height:1.1;min-width:96px}
.party-card .shop small{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.party-card .shop.imp{color:var(--blue);background:var(--blue-tint)}
.party-card .shop svg{width:34px;height:34px}
@media (max-width:560px){.party-card{grid-template-columns:1fr}.party-card .shop{justify-self:start}}
@media (max-width:1180px){.top-gov .ur,.top-gov div{display:none}}
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;left:0;top:0;bottom:0;width:min(290px,84vw);transform:translateX(-102%);transition:transform .22s ease,visibility .22s;visibility:hidden}
  .app.open .sb{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(6,30,20,.45);z-index:45}
  .hamb{display:grid;place-items:center}
  h1{font-size:1.45rem}
}
@media (max-width:560px){
  .top{gap:10px;padding:10px 12px}
  .top .ur,.top-id span{display:none}
  .top-id b{font-size:.95rem}
  .gsearch kbd{display:none}
  main{padding-top:18px}
}
@media (prefers-reduced-motion:reduce){.sb{transition:none}}

/* ---------- surfaces ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.card > h2,.card-h{margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{margin:0}
.sec-n{width:26px;height:26px;border-radius:50%;background:var(--green-tint);color:var(--green-dark);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:.85rem;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;position:relative;overflow:hidden}
.tile b{display:block;font-family:var(--head);font-size:2rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.tile span{color:var(--muted);font-size:.9rem}
.tile.hot{border-color:#E4C67F;background:linear-gradient(180deg,var(--brass-tint),#fff 85%)}
.tile.hot::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brass)}
.tile.money b{font-size:1.3rem;padding-top:8px;white-space:nowrap}

/* ---------- forms ---------- */
label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
label.f i{font-style:normal;color:var(--faint);font-weight:500}
.field{margin-bottom:14px}
.hint{font-size:.83rem;color:var(--muted);margin-top:4px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;border:1px solid #C3CCC7;border-radius:var(--r-sm);padding:10px 12px;background:#fff;min-height:44px;transition:border-color .15s}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:3px solid var(--green-tint);outline-offset:0}
input[readonly]{background:var(--soft);color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.span2{grid-column:span 2}
@media (max-width:700px){.g2,.g3{grid-template-columns:1fr}.span2{grid-column:auto}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #C3CCC7;border-radius:var(--r-sm);padding:10px 18px;font-weight:700;cursor:pointer;min-height:44px;background:#fff;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dark)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--pine)}
.btn.brass:hover{filter:brightness(.96)}
.btn.danger{color:var(--red);border-color:#DDA9A3}
.btn.danger:hover{background:var(--red-tint)}
.btn.big{font-size:1.05rem;padding:14px 22px;min-height:54px}
.btn.wide{width:100%}
.btn.link{border:0;background:none;color:var(--green);padding:4px 6px;min-height:0}
.btn.link:hover{text-decoration:underline;background:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;border-radius:var(--r-sm);padding:8px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg input:checked + span{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg input:focus-visible + span{outline:3px solid #2E7FE8}

/* request form layout */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.summary{position:sticky;top:20px}
.summary .card{padding:0;overflow:hidden}
.sum-top{background:var(--pine);color:#fff;padding:16px 20px}
.sum-top small{color:rgba(255,255,255,.65);font-size:.8rem}
.sum-top b{display:block;font-family:var(--head);font-size:1.15rem;margin-top:2px}
.sum-body{padding:16px 20px}
.sum-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.sum-line span:first-child{color:var(--muted)}
.sum-line span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.sum-items{margin:8px 0 0;padding:0;list-style:none;font-size:.9rem}
.sum-items li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.limit{border-radius:var(--r-sm);padding:10px 12px;margin:14px 0 4px;font-size:.9rem;border:1px solid}
.limit.ok{background:var(--green-tint);border-color:var(--green-line);color:var(--green-dark)}
.limit.over{background:var(--amber-tint);border-color:#E8C88A;color:#5B3A00}
.limit.wait{background:var(--soft);border-color:var(--line);color:var(--muted)}
.limit ul{margin:4px 0 0;padding-left:18px}
.sum-foot{padding:0 20px 20px}
@media (max-width:1050px){.form-grid{grid-template-columns:1fr}.summary{position:static}}

.goods{width:100%;border-collapse:collapse}
.goods th{font-size:.82rem;text-align:left;color:var(--muted);font-weight:600;padding:0 6px 6px}
.goods td{padding:4px 6px;vertical-align:top}
.goods td.n{width:28px;padding-top:14px;color:var(--faint);font-weight:700}
@media (max-width:700px){
  .goods thead{display:none}
  .goods tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:8px}
  .goods td{padding:0;width:auto!important}.goods td.n{display:none}.goods td.c-item{grid-column:1/-1}
}
.vendor-pick{position:relative}
.vlist{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 12px 30px rgba(10,40,25,.14);max-height:280px;overflow-y:auto;margin-top:4px}
.vlist button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.vlist button:hover,.vlist button:focus{background:var(--green-tint)}
.vlist b{font-family:var(--head)}
.party{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:4px}
.party .shop{font-family:var(--head);font-weight:800;font-size:1.25rem;color:var(--green-dark);background:var(--green-tint);border-radius:var(--r-sm);padding:8px 12px;text-align:center;line-height:1.1}
.party .shop small{display:block;font-size:.7rem;font-weight:600;color:var(--muted)}

/* ---------- callouts, stamps ---------- */
.note{border-radius:var(--r);padding:12px 14px;margin:0 0 14px;border:1px solid;font-size:.95rem}
.note.warn{background:var(--amber-tint);border-color:#E8C88A;color:#5B3A00}
.note.bad{background:var(--red-tint);border-color:#E6B4AE;color:#6B1B14}
.note.good{background:var(--green-tint);border-color:var(--green-line);color:var(--green-dark)}
.note.info{background:var(--blue-tint);border-color:#BBCDE6;color:#16406E}
.note ul{margin:6px 0 0;padding-left:20px}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:5px;padding:1px 8px;font-family:var(--head);font-weight:700;font-size:.8rem;white-space:nowrap}
.st-pending_supervisor{color:var(--amber)} .st-pending_incharge{color:var(--blue)} .st-returned{color:#7A3E9D}
.st-approved{color:var(--green)} .st-used{color:#46524C} .st-rejected,.st-expired{color:var(--red)} .st-cancelled{color:var(--faint)}
.stamp.lg{font-size:1rem;padding:4px 12px;border-width:3px;transform:rotate(-2.5deg)}
.chip{display:inline-block;font-size:.74rem;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.chip.extra{color:var(--amber);background:var(--amber-tint)}
.chip.imp{color:var(--blue);background:var(--blue-tint)}
.chip.exp{color:var(--green-dark);background:var(--green-tint)}

/* ---------- tables ---------- */
.tbl{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:.94rem}
table.data th{text-align:left;font-weight:600;font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 12px;white-space:nowrap;background:var(--soft)}
table.data td{border-bottom:1px solid var(--line);padding:11px 12px;vertical-align:top}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:#F5FAF7}
.nocno{font-family:var(--head);font-weight:700;white-space:nowrap}
.nw{white-space:nowrap}
.card.flush{padding:0;overflow:hidden}
.card.flush .card-h{padding:16px 20px 0;margin-bottom:12px}
@media (max-width:1150px){
  table.data.cards thead{display:none}
  table.data.cards tr{display:block;border-bottom:1px solid var(--line);padding:10px 14px}
  table.data.cards tr{background:#fff}
  table.data.cards td{display:block;position:relative;border:0;padding:4px 0 4px 108px;text-align:left;white-space:normal;min-height:28px;overflow-wrap:anywhere}
  table.data.cards td::before{content:attr(data-l);position:absolute;left:0;top:5px;width:98px;color:var(--muted);font-size:.84rem}
  table.data.cards td .nw,table.data.cards td.nw{white-space:normal}
  table.data.cards td:empty{display:none}
}
@media (min-width:701px) and (max-width:1150px){
  table.data.cards tbody{display:grid;grid-template-columns:1fr 1fr}
  table.data.cards tbody tr{border-right:1px solid var(--line)}
}
.empty{padding:34px 12px;text-align:center;color:var(--muted)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-items:end;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--soft)}
.filters .field{margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--green)}

/* ---------- modal / detail ---------- */
.modal{position:fixed;inset:0;background:rgba(6,30,20,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
.sheet{background:var(--paper);border-radius:12px;width:100%;max-width:900px;box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden}
.sheet.sm{max-width:560px}
.sheet-head{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:linear-gradient(180deg,var(--soft),#fff)}
.sheet-body{padding:20px 22px}
.sheet-foot{padding:16px 22px;border-top:1px solid var(--line);background:var(--soft)}
.x{margin-left:auto;background:none;border:0;font-size:1.7rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:6px}
.x:hover{background:var(--line)}
dl.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 20px;margin:0 0 18px}
dl.kv dt{font-size:.8rem;color:var(--muted)}
dl.kv dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.subh{font-family:var(--head);font-size:.95rem;font-weight:700;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.subh::after{content:"";flex:1;height:1px;background:var(--line)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 24px;font-size:.92rem}
.timeline li::before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--green)}
.timeline li::after{content:"";position:absolute;left:10px;top:18px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}

/* ---------- scan ---------- */
.scan-grid{display:grid;grid-template-columns:minmax(0,390px) 1fr;gap:20px;align-items:start}
@media (max-width:950px){.scan-grid{grid-template-columns:1fr}}
#reader{width:100%;aspect-ratio:1/1;max-height:390px;background:var(--pine);border-radius:var(--r);overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.6);position:relative}
#reader.idle::after{content:"";position:absolute;inset:22%;border:2px solid rgba(194,155,58,.7);border-radius:12px}
.verdict{border-radius:var(--r);padding:24px 24px 22px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.verdict h2{font-size:2.2rem;font-weight:800;letter-spacing:-.025em}
.verdict p{margin:6px 0 0;font-size:1.05rem;opacity:.95}
.verdict.ok{background:var(--green)} .verdict.no{background:var(--red)} .verdict.done{background:var(--pine)}

/* ---------- login (government portal) ---------- */
.gov{min-height:100vh;display:flex;flex-direction:column;background:#EDF2EF}
.gov-wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.gov-head{background:#fff;border-bottom:1px solid var(--line)}
.gov-head .gov-wrap{display:flex;align-items:center;gap:clamp(12px,2vw,20px);padding-top:14px;padding-bottom:14px}
.gov-head img{width:clamp(54px,7vw,78px);height:auto;flex:none}
.gov-title b{display:block;font-family:var(--head);font-weight:800;font-size:clamp(1.05rem,2.3vw,1.55rem);color:var(--pine);letter-spacing:-.01em;line-height:1.15}
.gov-title span{display:block;font-size:clamp(.82rem,1.4vw,.98rem);color:var(--ink);font-weight:600;margin-top:2px}
.gov-title small{display:block;font-size:clamp(.76rem,1.2vw,.88rem);color:var(--muted)}
.gov-ur{margin-left:auto;font-family:'Noto Nastaliq Urdu',serif;font-size:clamp(1.1rem,2.2vw,1.6rem);color:var(--pine);line-height:2;white-space:nowrap}
.gov-band{background:var(--pine);color:#fff;border-bottom:1px solid rgba(0,0,0,.2)}
.gov-band .gov-wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding-top:11px;padding-bottom:11px}
.gov-band b{font-family:var(--head);font-weight:700;font-size:clamp(.98rem,1.8vw,1.12rem)}
.gov-band span{color:rgba(255,255,255,.72);font-size:clamp(.82rem,1.4vw,.95rem)}
.gov-main{flex:1;display:flex;align-items:center;padding:clamp(24px,5vw,56px) 0;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%),
  repeating-linear-gradient(135deg,rgba(10,54,38,.025) 0 2px,transparent 2px 14px)}
.gov-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,430px);gap:clamp(28px,5vw,72px);align-items:center}
.gov-intro h1{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:800;color:var(--pine);letter-spacing:-.025em;line-height:1.08}
.gov-intro > p{font-size:clamp(.98rem,1.5vw,1.1rem);color:var(--muted);margin:14px 0 26px;max-width:46ch}
.gov-facts{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:520px}
.gov-facts li{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.gov-facts li i{width:40px;height:40px;border-radius:10px;background:var(--green-tint);color:var(--green-dark);display:grid;place-items:center}
.gov-facts li i svg{width:21px;height:21px}
.gov-facts b{display:block;font-family:var(--head);font-size:.98rem}
.gov-facts span{color:var(--muted);font-size:.92rem}
.gov-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(10,54,38,.12);overflow:hidden}
.gov-card-h{background:var(--soft);border-bottom:1px solid var(--line);padding:18px 26px;display:flex;align-items:center;gap:12px}
.gov-card-h i{width:38px;height:38px;border-radius:50%;background:var(--pine);color:var(--brass);display:grid;place-items:center;flex:none}
.gov-card-h i svg{width:19px;height:19px}
.gov-card-h b{display:block;font-family:var(--head);font-size:1.15rem}
.gov-card-h span{font-size:.86rem;color:var(--muted)}
.gov-card form{padding:22px 26px 24px}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--green);font-weight:700;font-size:.86rem;padding:8px;cursor:pointer;border-radius:6px}
.pw button:hover{background:var(--green-tint)}
.gov-warn{display:flex;gap:10px;align-items:flex-start;font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding:14px 26px;background:var(--soft)}
.gov-warn svg{width:18px;height:18px;flex:none;color:var(--amber);margin-top:1px}
.gov-foot{background:var(--pine);color:rgba(255,255,255,.7);font-size:.84rem}
.gov-foot .gov-wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;padding-top:14px;padding-bottom:14px}
@media (max-width:900px){
  .gov-grid{grid-template-columns:1fr;max-width:560px;margin:0 auto}
  .gov-card{order:-1}
  .gov-intro h1{display:none}
  .gov-intro > p{margin:0 0 14px}
}
@media (max-width:560px){
  .gov-ur{display:none}
  .gov-title small{display:none}
  .gov-card-h,.gov-card form,.gov-warn{padding-left:18px;padding-right:18px}
  .gov-facts li{padding:12px 14px}
}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,520px)}
#toast div{background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast div.err{background:var(--red)} #toast div.ok{background:var(--green)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* =====================================================================
   PRINT - three copies on one A4 page
   ===================================================================== */
#print-root{display:none}
@page{size:A4 portrait;margin:8mm}
@media print{body{background:#fff} body > *:not(#print-root){display:none!important} #print-root{display:block}}
.copy{position:relative;height:89mm;padding:2.6mm 4mm;border:1.3px solid #000;font:7.5pt/1.25 'Source Sans 3',Arial,sans-serif;color:#000;overflow:hidden;page-break-inside:avoid;background:#fff}
.cut{height:2mm;border-top:1px dashed #777;margin-top:2mm}
.copy .wm{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;pointer-events:none;font:800 30pt 'Archivo',Arial,sans-serif;color:rgba(0,0,0,.05);transform:rotate(-16deg);white-space:nowrap}
.copy .ph{display:grid;grid-template-columns:20mm 1fr 24mm;gap:3mm;align-items:center;border-bottom:1.3px solid #000;padding-bottom:1.4mm}
.copy .logo{width:20mm;height:20mm;display:grid;place-items:center}
.copy .logo img{width:100%;height:100%;object-fit:contain}
.copy .org{text-align:center}
.copy .org > b{display:block;font:800 9.5pt 'Archivo',Arial,sans-serif}
.copy .org > span{display:block;font-size:7.4pt}
.copy .org .t{margin-top:1mm;display:flex;justify-content:center;gap:1.5mm;align-items:center}
.copy .org .t em{font:800 8.8pt 'Archivo',Arial,sans-serif;font-style:normal;border:1.3px solid #000;padding:.3mm 2.5mm}
.copy .org .t strong{font:800 7.8pt 'Archivo',Arial,sans-serif;background:#000;color:#fff;padding:.5mm 2.4mm;border:1.3px solid #000}
.copy .qr{text-align:center}
.copy .qr svg{width:21mm;height:21mm;display:block;margin:0 auto}
.copy .qr small{display:block;font-weight:700;font-size:6.4pt;margin-top:.3mm}
.copy .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:.5mm 3mm;margin:1.3mm 0 1mm}
.copy .meta i{display:block;font-style:normal;color:#444;font-size:6.2pt}
.copy .meta b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy .meta .w2{grid-column:span 2}
.copy table{width:100%;border-collapse:collapse}
.copy th,.copy td{border:.8px solid #000;padding:.3mm 1.2mm;text-align:left}
.copy th{background:#EDEDED;font-size:6.6pt}
.copy td.n,.copy th.n{text-align:right}
.copy .duty{margin-top:1mm;font-weight:700;font-size:8pt}
.copy .foot{position:absolute;left:4mm;right:4mm;bottom:2.4mm;display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:3mm;align-items:end;font-size:6.4pt}
.copy .sig{border-top:.8px solid #000;text-align:center;padding-top:.4mm}
/* full-page copy (more than 6 items) */
.copy.full{height:auto;min-height:279mm;display:flex;flex-direction:column;padding:6mm 7mm 5mm;font-size:9.4pt;overflow:visible;page-break-inside:auto;break-after:page;page-break-after:always}
.copy.full:last-child{break-after:auto;page-break-after:auto}
.copy.full .wm{font-size:54pt;align-items:start;padding-top:120mm;overflow:hidden}
.copy.full th:nth-child(2){width:26mm!important}
.copy.full th:nth-child(4){width:30mm!important}
.copy.full .ph{grid-template-columns:28mm 1fr 34mm;padding-bottom:3mm;border-bottom-width:1.6px}
.copy.full .logo{width:27mm;height:27mm}
.copy.full .org > b{font-size:14pt}
.copy.full .org > span{font-size:10pt}
.copy.full .org .t{margin-top:2mm;gap:2.5mm}
.copy.full .org .t em{font-size:12pt;padding:.6mm 4mm}
.copy.full .org .t strong{font-size:10.5pt;padding:.8mm 3.5mm}
.copy.full .qr svg{width:31mm;height:31mm}
.copy.full .qr small{font-size:8.4pt}
.copy.full .meta{gap:2mm 4mm;margin:4mm 0 4mm}
.copy.full .meta i{font-size:8pt}
.copy.full .meta b{font-size:10pt}
.copy.full th{font-size:8.8pt;padding:1.2mm 2mm}
.copy.full td{padding:1.2mm 2mm}
.copy.full tr{page-break-inside:avoid;break-inside:avoid}
.copy.full thead{display:table-header-group}
.copy.full .tot{margin-top:2mm;font-weight:700}
.copy.full .duty{font-size:11.5pt;margin-top:2mm}
.copy.full .foot{position:static;margin-top:auto;padding-top:18mm;font-size:8.6pt;break-inside:avoid;page-break-inside:avoid}
.copy.full .sig{padding-top:1mm}
.report-print{font:9pt/1.35 'Source Sans 3',Arial,sans-serif;color:#000}
.report-print h1{font-size:14pt;margin-bottom:2mm}
.report-print h2{font-size:11pt;margin:5mm 0 1.5mm}
.report-print table{width:100%;border-collapse:collapse}
.report-print th,.report-print td{border:.8px solid #000;padding:1mm 1.5mm;text-align:left}
.report-print .num{text-align:right}
</style>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ = 'Asia/Karachi';
const fmtDT = d => d ? new Intl.DateTimeFormat('en-GB', {timeZone: TZ, day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true}).format(new Date(d)) : '—';
const fmtD = d => d ? new Intl.DateTimeFormat('en-GB', {timeZone: TZ, day: '2-digit', month: 'short', year: 'numeric'}).format(new Date(d)) : '—';
const fmtDay = s => fmtD(s + 'T12:00:00+05:00');
const fmtQty = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 2});
const fmtRs = n => n == null ? '—' : 'Rs ' + Number(n).toLocaleString('en-US', {maximumFractionDigits: 2});
const digits = s => String(s || '').replace(/\D/g, '');
const fmtCNIC = s => { const d = digits(s); return d.length === 13 ? `${d.slice(0,5)}-${d.slice(5,12)}-${d.slice(12)}` : (s || '—'); };
const todayPK = () => new Intl.DateTimeFormat('en-CA', {timeZone: TZ}).format(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const sb = configured && window.supabase ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY,
  {auth: {persistSession: true, autoRefreshToken: true, storageKey: 'mand-noc-auth'}}) : null;

async function rpc(fn, args = {}) {
  const {data, error} = await sb.rpc(fn, args);
  if (error) {
    if (/JWT|not authori[sz]ed|log in again/i.test(error.message)) setTimeout(logout, 1500);
    throw new Error(error.message.replace(/^.*?ERROR:\s*/, ''));
  }
  return data;
}
async function busy(btn, fn) {
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Please wait'; }
  try { return await fn(); } catch (e) { toast(e.message, 'err'); return null; }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}

/* =====================================================================
   START / LOGIN
   ===================================================================== */
(function () { const m = location.hash.match(/v=([0-9a-fA-F]{32})/);
  if (m) { S.pendingCode = m[1]; history.replaceState(null, '', location.pathname + location.search); } })();
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/v=([0-9a-fA-F]{32})/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (S.me) go('scan', {code: m[1]}); else { S.pendingCode = m[1]; renderLogin(); }
});

async function start() {
  if (!configured || !sb) { $('#app').innerHTML = '<div class="empty">Supabase settings are missing in index.html.</div>'; return; }
  const {data} = await sb.auth.getSession();
  if (data.session) { try { await enter(); return; } catch (e) { await sb.auth.signOut(); } }
  renderLogin();
}
async function enter() {
  S.me = await rpc('app_me'); S.lk = await rpc('app_lookups');
  renderShell();
  if (S.pendingCode) { const c = S.pendingCode; S.pendingCode = null; go('scan', {code: c}); } else go('home');
  refreshCounts(); clearInterval(S.cTimer); S.cTimer = setInterval(refreshCounts, 45000); armIdle();
}
async function logout() {
  clearInterval(S.cTimer); stopScanner(); try { await sb.auth.signOut(); } catch (e) {}
  S.me = null; closeModal(); renderLogin();
}
function armIdle() {
  let last = Date.now();
  ['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => last = Date.now(), {passive: true}));
  clearInterval(S.iTimer);
  S.iTimer = setInterval(() => { if (S.me && Date.now() - last > CONFIG.IDLE_LOGOUT_MINUTES * 60000) { logout(); toast('Logged out after a period of no activity.'); } }, 30000);
}

function renderNav() {
  $('#nav').innerHTML = NAV[role()].map(e => {
    if (e.length === 1) return `<div class="grp">${e[0]}</div>`;
    const [k, label, ic, cnt] = e, n = cnt ? S.counts[cnt] : 0;
    return `<button data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${ico(ic)}<span>${label}</span>${n ? `<span class="badge">${n}</span>` : ''}</button>`;
  }).join('');
  $$('#nav button').forEach(b => b.onclick = () => go(b.dataset.v));
}
async function refreshCounts() { if (!S.me) return; try { S.counts = await rpc('app_counts'); renderNav(); } catch (e) {} }

const V = {};
function go(view, params = {}) {
  if (S.view === 'scan' && view !== 'scan') stopScanner();
  S.view = view; S.reload = null; renderNav();
  const main = $('#main'); main.innerHTML = '<div class="empty"><span class="spin"></span></div>'; window.scrollTo(0, 0);
  Promise.resolve(V[view](main, params)).catch(e => { main.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; });
}

function nocTable(rows) {
  if (!rows || !rows.length) return `<div class="empty">Nothing to show yet.</div>`;
  return `<div class="tbl"><table class="data cards"><thead><tr><th>NOC no.</th><th>Date</th><th>Importer / vendor</th><th>Vehicle</th><th>Goods</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r => `<tr class="click" data-id="${esc(r.id)}" tabindex="0">
    <td data-l="NOC no."><span class="nocno">${esc(r.noc_no)}</span>${typeChip(r.noc_type)}</td>
    <td data-l="Date" class="nw">${fmtDT(r.created_at)}</td>
    <td data-l="Party">${esc(r.party_name)}<div class="small muted nw">${r.shop_no ? 'Shop ' + esc(r.shop_no) + ' - ' + esc(r.firm_name) : fmtCNIC(r.party_cnic)}</div></td>
    <td data-l="Vehicle" class="nw">${esc(r.vehicle_no)}</td>
    <td data-l="Goods" class="small">${esc(r.items_summary)}</td>
    <td data-l="Status">${stamp(r.display_status)}${r.over_limit ? '<span class="chip extra">Extra</span>' : ''}
      ${r.status === 'returned' && r.return_note ? `<div class="small" style="color:#7A3E9D">${esc(r.return_note)}</div>` : ''}
      ${r.status === 'rejected' && r.reject_reason ? `<div class="small" style="color:var(--red)">${esc(r.reject_reason)}</div>` : ''}</td>
  </tr>`).join('')}</tbody></table></div>`;
}
function bindRows(root) { $$('tr.click', root).forEach(tr => { tr.onclick = () => openNoc(tr.dataset.id); tr.onkeydown = e => { if (e.key === 'Enter') openNoc(tr.dataset.id); }; }); }

function listView(title, sub, fixed) {
  return async (main, params = {}) => {
    const f = Object.assign({status: 'all', type: '', from: addDays(todayPK(), -30), to: todayPK(), q: ''}, params);
    main.innerHTML = head(title, sub, `<button class="btn" id="rf">Refresh</button>`) + `
    <section class="card flush">
      <div class="lbar">${searchBox('fq', f.q, 'Search by NOC no., vehicle no., name, Shop # or CNIC')}<span class="cnt" id="cnt"></span></div>
      <form class="filters" id="fl">
        ${fixed ? '' : `<div class="field"><label class="f" for="fs">Status</label><select id="fs">
          ${[['all','All'],['pending','In process'],['pending_supervisor','With Supervisor'],['pending_incharge','With Incharge'],['returned','Returned to Customs'],
             ['approved','NOC issued (valid)'],['used','Used at gate'],['expired','Expired'],['rejected','Rejected'],['cancelled','Cancelled']]
            .map(([k, l]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`}
        <div class="field"><label class="f" for="ft">Type</label><select id="ft"><option value="">Import and export</option>
          <option value="import" ${f.type === 'import' ? 'selected' : ''}>Import</option><option value="export" ${f.type === 'export' ? 'selected' : ''}>Export</option></select></div>
        ${fixed ? '' : `<div class="field"><label class="f" for="ff">From</label><input type="date" id="ff" value="${f.from}"></div>
          <div class="field"><label class="f" for="fto">To</label><input type="date" id="fto" value="${f.to}"></div>`}
        <div class="field"><button class="btn primary wide">Show</button></div>
      </form>
      <div id="lo2"></div>
    </section>`;
    const load = async () => {
      const q = $('#fq').value.trim();
      $('#lo2').innerHTML = '<div class="empty"><span class="spin"></span></div>';
      try {
        const rows = await rpc('app_list_nocs', {p_status: fixed || $('#fs').value, p_type: $('#ft').value || null,
          p_from: fixed || q ? null : $('#ff').value || null, p_to: fixed || q ? null : $('#fto').value || null, p_search: q || null, p_limit: 500});
        $('#cnt').textContent = `${rows.length} record${rows.length === 1 ? '' : 's'}${q && !fixed ? ' - all dates' : ''}${rows.length >= 500 ? ' (first 500)' : ''}`;
        $('#lo2').innerHTML = rows.length ? nocTable(rows) : `<div class="empty">${$('#fq').value.trim() ? `No NOC matches "${esc($('#fq').value.trim())}".` : 'Nothing to show.'}</div>`;
        bindRows($('#lo2'));
      } catch (e) { $('#lo2').innerHTML = `<div class="note bad" style="margin:16px">${esc(e.message)}</div>`; }
    };
    $('#fl').onsubmit = e => { e.preventDefault(); load(); };
    $('#fq').addEventListener('input', debounce(load, 350));
    $('#fq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); load(); } });
    ['fs', 'ft', 'ff', 'fto'].forEach(id => { const el = $('#' + id); if (el) el.addEventListener('change', load); });
    $('#rf').onclick = () => { load(); refreshCounts(); };
    S.reload = load; await load();
  };
}

function cnicInput(el) {
  el.addEventListener('input', () => { const d = digits(el.value).slice(0, 13);
    el.value = d.length > 12 ? `${d.slice(0,5)}-${d.slice(5,12)}-${d.slice(12)}` : d.length > 5 ? `${d.slice(0,5)}-${d.slice(5)}` : d; });
}
function goodsEditor(tbody, addBtn, cat, initial, onChange) {
  const list = itemsOf(cat);
  const add = (v = {}) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="n"></td>
      <td class="c-item"><select class="it" aria-label="Item"><option value="">Select item</option>${list.map(i => `<option value="${i.id}">${esc(i.name)} (${esc(i.code)})</option>`).join('')}</select></td>
      <td style="width:150px"><select class="un" aria-label="Unit"></select></td>
      <td style="width:150px"><input type="number" class="qt" min="0" step="any" inputmode="decimal" aria-label="Quantity" placeholder="Quantity"></td>
      <td style="width:70px"><button type="button" class="btn link rm">Remove</button></td>`;
    tbody.appendChild(tr);
    const it = $('.it', tr), un = $('.un', tr), qt = $('.qt', tr);
    const units = () => { const x = itemById(it.value); un.innerHTML = (x ? x.units : []).map(u => `<option>${esc(u)}</option>`).join(''); };
    it.onchange = () => { units(); onChange(); }; un.onchange = onChange; qt.oninput = onChange;
    $('.rm', tr).onclick = () => { if (tbody.children.length > 1) { tr.remove(); num(); onChange(); } };
    if (v.item_id) { it.value = v.item_id; units(); un.value = v.unit; qt.value = v.quantity; }
    num();
  };
  const num = () => [...tbody.children].forEach((tr, i) => tr.firstElementChild.textContent = i + 1);
  addBtn.onclick = () => { add(); onChange(); };
  (initial && initial.length ? initial : [{}]).forEach(add);
  return () => [...tbody.children].map(tr => ({item_id: Number($('.it', tr).value) || null, unit: $('.un', tr).value, quantity: $('.qt', tr).value}));
}
const goodsHTML = `<table class="goods"><thead><tr><th></th><th>Item</th><th>Unit</th><th>Quantity</th><th></th></tr></thead><tbody id="gb"></tbody></table>
  <button type="button" class="btn" id="ga" style="margin-top:8px">Add another item</button>`;
function goodsErrors(lines) {
  const e = [];
  lines.forEach((l, i) => { if (!l.item_id) e.push(`Goods line ${i + 1}: select an item.`); else if (!(Number(l.quantity) > 0)) e.push(`Goods line ${i + 1}: enter the quantity.`); });
  const k = lines.map(l => l.item_id + '|' + l.unit); if (new Set(k).size !== k.length) e.push('The same item and unit is entered twice.');
  return e;
}
function limitBox(r, kind) {
  if (!r) return `<div class="limit wait">Limit check appears when the ${kind} and goods are entered.</div>`;
  return r.over ? `<div class="limit over"><b>Over the weekly limit</b><ul>${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>Goes to the Supervisor for extra approval first.</div>`
    : `<div class="limit ok"><b>Within the limit</b> - ${r.used} of ${r.limit} vehicles used this week.</div>`;
}
function sumItems(lines) {
  const ok = lines.filter(l => l.item_id && Number(l.quantity) > 0);
  return ok.length ? `<ul class="sum-items">${ok.map(l => `<li><span>${esc(itemById(l.item_id).name)}</span><b>${fmtQty(l.quantity)} ${esc(l.unit)}</b></li>`).join('')}</ul>` : '<p class="small muted" style="margin:6px 0 0">No goods yet</p>';
}

    if (!r) return;
    refreshCounts(); doneScreen(main, r);

};

function doneScreen(main, r) {
  const issued = r.status === 'approved';
  main.innerHTML = `<section class="card" style="max-width:660px;padding:30px">
    <div class="row" style="margin-bottom:12px"><h1 style="font-size:1.6rem">${issued ? 'NOC generated' : 'Request sent'}</h1>${stamp(r.display_status, true)}</div>
    <p style="font-size:1.15rem;margin:0 0 8px"><span class="nocno">${esc(r.noc_no)}</span> ${typeChip(r.noc_type)} - ${esc(r.party_name)}, vehicle ${esc(r.vehicle_no)}</p>
    <p class="muted" style="margin:0 0 20px">${issued ? `Valid until ${fmtD(r.valid_until)}. Print the three copies now.`
      : r.status === 'pending_supervisor' ? 'It is over the weekly limit, so it has gone to the Supervisor first. After approval it goes to the Incharge.'

  $('#vw').onclick = () => openNoc(r.id); $('#an').onclick = () => go(S.view);
}

/* =====================================================================

   ===================================================================== */
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.style.overflow = ''; }
function modal(html) {
  const m = $('#modal'); m.hidden = false; m.innerHTML = html; document.body.style.overflow = 'hidden';
  m.onclick = e => { if (e.target === m) closeModal(); };
  document.onkeydown = e => { if (e.key === 'Escape' && !m.hidden) closeModal(); };
}
async function openNoc(id) {
  modal('<div class="sheet"><div class="sheet-body"><div class="empty"><span class="spin"></span></div></div></div>');
  try { renderNoc(await rpc('app_get_noc', {p_id: id})); }
  catch (e) { modal(`<div class="sheet sm"><div class="sheet-body"><div class="note bad">${esc(e.message)}</div><button class="btn" onclick="closeModal()">Close</button></div></div>`); }
}
function partyKV(n) {
  return n.noc_type === 'export'
    ? `<div><dt>Shop #</dt><dd>${esc(n.shop_no)}</dd></div><div><dt>Vendor</dt><dd>${esc(n.party_name)}</dd></div>
       <div><dt>Firm</dt><dd>${esc(n.firm_name)}</dd></div><div><dt>CNIC</dt><dd>${fmtCNIC(n.party_cnic)}</dd></div><div><dt>Mobile</dt><dd>${esc(n.mobile || '—')}</dd></div>`
    : `<div><dt>Importer</dt><dd>${esc(n.party_name)}</dd></div><div><dt>Father's name</dt><dd>${esc(n.father_name || '—')}</dd></div>
       <div><dt>CNIC</dt><dd>${fmtCNIC(n.party_cnic)}</dd></div><div><dt>Mobile</dt><dd>${esc(n.mobile || '—')}</dd></div><div><dt>Address / tehsil</dt><dd>${esc(n.address || '—')}</dd></div>`;
}

  ${ds === 'cancelled' ? `<div class="note bad"><b>Cancelled by ${esc(n.cancelled_by_name)}</b>, ${fmtDT(n.cancelled_at)}<br>${esc(n.cancel_reason)}</div>` : ''}

function renderNoc(n) {
  const r = role(), ds = n.display_status;
  const supAct = r === 'supervisor' && n.status === 'pending_supervisor';
  const incAct = r === 'incharge' && n.status === 'pending_incharge';
  const cusAct = r === 'customs' && n.status === 'returned';
  const canPrint = ['approved', 'used', 'expired'].includes(ds);
  modal(`<div class="sheet">
    <div class="sheet-head"><div><div class="small muted">${n.noc_type === 'export' ? 'Export' : 'Import'} - ${esc(n.market)} Border Market</div>
      <h2 style="font-size:1.55rem" class="nocno">${esc(n.noc_no)}</h2></div>${stamp(ds, true)}<button class="x" aria-label="Close" id="cx">&times;</button></div>
    <div class="sheet-body">${detailHTML(n)}</div>
    <div class="sheet-foot">
      ${supAct || incAct ? `<div class="field"><label class="f" for="an">Note <i>${supAct ? '(required to reject)' : n.noc_type === 'import' ? '(required to return)' : '(required to cancel)'}</i></label><textarea id="an" maxlength="500"></textarea></div>` : ''}
      <div class="row">
        ${supAct ? `<button class="btn primary" id="aOk">Approve extra allowance</button><button class="btn danger" id="aRej">Reject</button>` : ''}
        ${incAct ? `<button class="btn primary" id="aGen">Verify and generate NOC</button>${n.noc_type === 'import' ? '<button class="btn" id="aRet">Return to Customs</button>' : '<button class="btn danger" id="aCan">Cancel</button>'}` : ''}
        ${cusAct ? `<button class="btn primary" id="aFix">Correct and send again</button><button class="btn danger" id="aCan2">Cancel request</button>` : ''}
        ${canPrint ? `<button class="btn brass" id="aPr">Print NOC</button>` : ''}
        <span class="spacer"></span><button class="btn link" id="aPty">All NOCs of this ${n.noc_type === 'export' ? 'vendor' : 'importer'}</button><button class="btn" id="aCl">Close</button>
      </div></div></div>`);
  $('#cx').onclick = $('#aCl').onclick = closeModal;
  const act = async (fn, action, btn, needNote, confirmMsg) => {
    const note = $('#an').value.trim();
    if (needNote && note.length < 3) { toast(needNote, 'err'); $('#an').focus(); return; }
    if (confirmMsg && !confirm(confirmMsg)) return;
    const res = await busy(btn, () => rpc(fn, {p_id: n.id, p_action: action, p_note: note || null}));
    if (!res) return;
    toast({approve: 'Extra allowance approved. Sent to the Incharge.', reject: `${n.noc_no} rejected.`, generate: `NOC ${n.noc_no} generated.`,
      return: 'Returned to Customs for correction.', cancel: `${n.noc_no} cancelled.`}[action], 'ok');
    refreshCounts(); if (S.reload) S.reload();
    renderNoc(res); if (action === 'generate') setTimeout(() => printNoc(res), 300);
  };
  if ($('#aOk')) $('#aOk').onclick = e => act('app_supervisor_action', 'approve', e.currentTarget, null, `Approve ${n.noc_no} as an EXTRA allowance? It will be listed in the extra allowance report.`);
  if ($('#aRej')) $('#aRej').onclick = e => act('app_supervisor_action', 'reject', e.currentTarget, 'Write the reason for rejection.', `Reject ${n.noc_no}? This cannot be undone.`);
  if ($('#aGen')) $('#aGen').onclick = e => act('app_incharge_action', 'generate', e.currentTarget, null, `Generate the NOC for ${n.noc_no}? It cannot be changed afterwards.`);
  if ($('#aRet')) $('#aRet').onclick = e => act('app_incharge_action', 'return', e.currentTarget, 'Write what Customs needs to correct.');
  if ($('#aCan')) $('#aCan').onclick = e => act('app_incharge_action', 'cancel', e.currentTarget, 'Write the reason for cancelling.', `Cancel ${n.noc_no}?`);
  if ($('#aFix')) $('#aFix').onclick = () => { closeModal(); S.view = 'returned'; renderNav(); const m = $('#main'); V.newImport(m, {noc: n}); };
  if ($('#aCan2')) $('#aCan2').onclick = () => cancelDialog(n, 'app_cancel_import');
  if ($('#aPr')) $('#aPr').onclick = () => printNoc(n);
  $('#aPty').onclick = () => { closeModal(); go('reports', {tab: 'party', q: n.shop_no || n.party_cnic}); };
}
function cancelDialog(n, fn) {
  modal(`<div class="sheet sm"><div class="sheet-head"><h2>Cancel ${esc(n.noc_no)}</h2><button class="x" id="cx">&times;</button></div>
    <div class="sheet-body"><p class="muted" style="margin-top:0">The request will be closed. A new request can still be entered later.</p>
    <div class="field"><label class="f" for="cr">Reason</label><textarea id="cr"></textarea></div></div>
    <div class="sheet-foot"><div class="row"><button class="btn danger" id="cy">Cancel the request</button><span class="spacer"></span><button class="btn" id="cnn">Keep it</button></div></div></div>`);
  $('#cx').onclick = $('#cnn').onclick = closeModal;
  $('#cy').onclick = async e => {
    const why = $('#cr').value.trim(); if (why.length < 3) { toast('Write the reason for cancelling.', 'err'); return; }
    const r = await busy(e.currentTarget, () => rpc(fn, {p_id: n.id, p_reason: why}));
    if (r) { closeModal(); toast(`${n.noc_no} cancelled.`, 'ok'); refreshCounts(); go('returned'); }
  };
}

const verifyURL = tok => `${location.origin === 'null' || location.protocol === 'file:' ? '' : location.origin + location.pathname}#v=${tok}`;

    <div class="ph"><div class="logo"><img src="${LOGO}" alt=""></div>
      <div class="org"><b>${ORG.gov}</b><span>${ORG.dept}, ${ORG.office}</span><span>${esc(n.market)} Border Market</span>
        <div class="t"><em>${imp ? 'IMPORT' : 'EXPORT'} NOC / GATE PASS</em><strong>${label}</strong></div></div>
      <div class="qr">${qrSVG(verifyURL(n.qr_token))}<small>${esc(n.noc_no)}</small></div></div>
    <div class="meta">
      <div><i>NOC no.</i><b>${esc(n.noc_no)}</b></div><div><i>Generated</i><b>${fmtDT(n.issued_at)}</b></div>
      <div><i>Valid until</i><b>${fmtD(n.valid_until)}</b></div><div><i>Vehicle no.</i><b>${esc(n.vehicle_no)}</b></div>
      ${party}
      <div><i>Driver</i><b>${esc(n.driver_name)}</b></div><div><i>Driver CNIC</i><b>${fmtCNIC(n.driver_cnic)}</b></div>
    </div>
    <table><thead><tr><th style="width:6mm">#</th><th style="width:17mm">Code</th><th>Item</th><th class="n" style="width:24mm">Quantity</th><th style="width:18mm">Unit</th></tr></thead><tbody>
      ${n.items.map(i => `<tr><td>${i.line_no}</td><td>${esc(i.item_code)}</td><td>${esc(i.item_name)}</td><td class="n">${fmtQty(i.quantity)}</td><td>${esc(i.unit)}</td></tr>`).join('')}</tbody></table>

    <div class="foot"><div>Generated by ${esc(n.issued_by_name || '—')}${n.over_limit && n.sup_by_name ? `<br>Extra allowance approved by ${esc(n.sup_by_name)}` : ''}<br>
      Valid for ONE crossing only. Scan the QR to verify.${ds !== 'approved' ? ` <b>(${esc(STATUS[ds])})</b>` : ''}</div>

// Up to COMPACT_MAX items: all three copies on one A4 page. More items: each copy on its own A4 page
// (a very long list continues on the next page with the column headings repeated).
const COMPACT_MAX = 6;
function printNoc(n) {
  const full = n.items.length > COMPACT_MAX;
  $('#print-root').innerHTML = ['VENDOR COPY', 'CUSTOMS COPY', 'INCHARGE COPY'].map(l => copyHTML(n, l)).join(full ? '' : '<div class="cut"></div>');
  setTimeout(() => window.print(), 60);
}
window.addEventListener('afterprint', () => { $('#print-root').innerHTML = ''; });

/* =====================================================================
   SCAN
   ===================================================================== */
async function stopScanner() { if (S.scanner) { try { await S.scanner.stop(); } catch (e) {} try { S.scanner.clear(); } catch (e) {} S.scanner = null; } }
V.scan = async (main, params = {}) => {
  const cu = role() === 'customs';
  main.innerHTML = head(cu ? 'Gate scan' : 'Scan QR', cu ? 'Scan the NOC, match the vehicle, driver and goods, then mark it as used. Each NOC works only once.' : 'Scan a NOC to see its full record. Only Customs can mark it as used.') + `
  <div class="scan-grid"><section>
    <div id="reader" class="idle">Camera is off</div>
    <div class="row" style="margin:12px 0 16px"><button class="btn primary big wide" id="cam">Start camera</button></div>
    <form id="mf" class="card" style="padding:16px 18px"><label class="f" for="mc">Or type / paste the code</label>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="mc" autocomplete="off" placeholder="Code from the QR link"><button class="btn">Check</button></div></form>
  </section><section id="res"><div class="card empty">Scan a QR code to see the NOC.</div></section></div>`;
  $('#cam').onclick = async () => {
    if (S.scanner) { await stopScanner(); $('#reader').className = 'idle'; $('#reader').textContent = 'Camera is off'; $('#cam').textContent = 'Start camera'; return; }
    if (!window.Html5Qrcode) { toast('Scanner did not load. Check the internet connection.', 'err'); return; }
    $('#reader').className = ''; $('#reader').innerHTML = ''; S.scanner = new Html5Qrcode('reader');
    try {
      await S.scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: {width: 240, height: 240}}, async text => {
        await stopScanner(); $('#cam').textContent = 'Start camera'; $('#reader').className = 'idle'; $('#reader').textContent = 'Camera is off';
        if (navigator.vibrate) navigator.vibrate(120); checkCode(text);
      });
      $('#cam').textContent = 'Stop camera';
    } catch (e) { S.scanner = null; $('#reader').className = 'idle'; $('#reader').textContent = 'Camera is off'; toast('Could not open the camera. Allow camera permission and use the https:// address.', 'err'); }
  };
  $('#mf').onsubmit = e => { e.preventDefault(); const v = $('#mc').value.trim(); if (v) checkCode(v); };
  if (params.code) checkCode(params.code);
};
async function checkCode(code) {
  const out = $('#res'); if (!out) return;
  out.innerHTML = '<div class="card empty"><span class="spin"></span> Checking</div>';
  let r; try { r = await rpc('app_scan', {p_code: code}); } catch (e) { out.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; return; }
  if (!r.valid) { out.innerHTML = `<div class="verdict no"><h2>Invalid QR code</h2><p>No NOC matches this code. Do not let the vehicle pass.</p></div>`; return; }
  scanResult(r.noc, false);
}
function scanResult(n, just) {
  const out = $('#res'), ds = n.display_status, cu = role() === 'customs';
  const v = just ? `<div class="verdict done"><h2>Marked as used</h2><p>${esc(n.noc_no)} - vehicle ${esc(n.vehicle_no)} may pass. This NOC cannot be used again.</p></div>`
    : ds === 'approved' ? `<div class="verdict ok"><h2>Valid NOC</h2><p>${esc(n.noc_no)} - valid until ${fmtD(n.valid_until)}. Match the vehicle and goods below.</p></div>`
    : ds === 'used' ? `<div class="verdict no"><h2>Already used</h2><p>Used on ${fmtDT(n.used_at)} by ${esc(n.used_by_name)}. Do not let the vehicle pass on this NOC.</p></div>`
    : ds === 'expired' ? `<div class="verdict no"><h2>Expired</h2><p>Expired on ${fmtDT(n.valid_until)}. Do not let the vehicle pass on this NOC.</p></div>`
    : `<div class="verdict no"><h2>Not valid</h2><p>${esc(STATUS[ds] || ds)}</p></div>`;
  out.innerHTML = v + (ds === 'approved' && !just ? (cu ? `<div class="card" style="padding:14px"><button class="btn primary big wide" id="use">Mark as used - allow vehicle to pass</button></div>`
      : `<div class="note info">Only the Customs account can mark this NOC as used at the gate.</div>`) : '') +
    `<section class="card"><div class="row" style="margin-bottom:14px"><h2 class="nocno" style="font-size:1.3rem">${esc(n.noc_no)}</h2>${typeChip(n.noc_type)}${stamp(ds)}</div>${detailHTML(n)}</section>`;
  if ($('#use')) $('#use').onclick = async e => {
    if (!confirm(`Mark ${n.noc_no} (vehicle ${n.vehicle_no}) as USED?\n\nCheck the vehicle number, driver and goods first. This cannot be undone.`)) return;
    const r = await busy(e.currentTarget, () => rpc('app_mark_used', {p_code: n.qr_token}));
    if (!r) return;
    if (r.ok) { toast(`${n.noc_no} marked as used.`, 'ok'); scanResult(r.noc, true); }
    else { toast('This NOC can no longer be used.', 'err'); if (r.noc) scanResult(r.noc, false); }
    refreshCounts();
  };
  out.scrollIntoView({block: 'start', behavior: 'smooth'});
}

function summaryReport(box) {
  const t = todayPK(), dow = (new Date(t + 'T12:00:00Z').getUTCDay() + 6) % 7;
  const P = {today: [t, t], week: [addDays(t, -dow), t], month: [t.slice(0, 8) + '01', t], last30: [addDays(t, -29), t]};
  box.innerHTML = `
  <section class="card">
    <div class="row" style="margin-bottom:14px;gap:14px">
      <div class="seg" role="radiogroup" aria-label="Type">${[['import','Import'],['export','Export']].map(([k, l], i) => `<label><input type="radio" name="ty" value="${k}" ${i ? '' : 'checked'}><span>${l}</span></label>`).join('')}</div>
      <div class="seg" role="radiogroup" aria-label="Period">${[['today','Today'],['week','This week'],['month','This month'],['last30','Last 30 days'],['custom','Custom']].map(([k, l]) =>
        `<label><input type="radio" name="pr" value="${k}" ${k === 'today' ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
    </div>
    <form class="row" id="rf" style="gap:10px;align-items:end">
      <div class="field" style="margin:0;width:180px"><label class="f" for="r1">From</label><input type="date" id="r1" value="${t}"></div>
      <div class="field" style="margin:0;width:180px"><label class="f" for="r2">To</label><input type="date" id="r2" value="${t}"></div>
      <button class="btn primary">Show report</button>
    </form>
  </section><div id="rep"></div>`;
  $$('input[name=pr]', box).forEach(r => r.onchange = () => { if (r.value !== 'custom') { $('#r1').value = P[r.value][0]; $('#r2').value = P[r.value][1]; load(); } else $('#r1').focus(); });
  $$('input[name=ty]', box).forEach(r => r.onchange = () => load());
  ['r1', 'r2'].forEach(id => $('#' + id).oninput = () => { $('input[name=pr][value=custom]').checked = true; });
  const load = async () => {
    $('#rep').innerHTML = '<div class="empty"><span class="spin"></span></div>';
    try {
      const r = await rpc('app_report', {p_from: $('#r1').value, p_to: $('#r2').value, p_type: $('input[name=ty]:checked').value});
      $('#rep').innerHTML = reportHTML(r, false);

    } catch (e) { $('#rep').innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
  };
  $('#rf').onsubmit = e => { e.preventDefault(); load(); };
  load();
}
const dlButtons = `<button class="btn" id="rD">${ico('pdf')}Download PDF</button><button class="btn" id="rX">${ico('xls')}Download Excel</button>`;
const repTitle = r => `${r.type === 'export' ? 'Export' : 'Import'} NOC report - ${r.market} Border Market - ${fmtDay(r.from)}${r.from !== r.to ? ' to ' + fmtDay(r.to) : ''}`;

  ${sec('Rejected and cancelled', tbl('<th>NOC no.</th><th>Name</th><th>Vehicle</th><th>Status</th><th>Reason</th><th>When</th>',
     r.closed_list.map(x => `<tr><td class="nocno">${esc(x.noc_no)}</td><td>${esc(x.name)}</td><td>${esc(x.vehicle_no)}</td><td>${esc(STATUS[x.status])}</td><td>${esc(x.reason)}</td><td>${fmtDT(x.at)}<div class="small muted">${esc(x.by)}</div></td></tr>`), 'None in this period.'))}`;
}

const fileStamp = () => todayPK();
const safeName = s => String(s || '').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
function needLib(ok, what) { if (!ok) { toast(`${what} download did not load. Check the internet connection and refresh the page.`, 'err'); return false; } return true; }
function saveXLSX(fname, sheets) {
  if (!needLib(window.XLSX, 'Excel')) return;
  const wb = XLSX.utils.book_new();
  sheets.forEach(sh => {
    const ws = XLSX.utils.aoa_to_sheet(sh.rows);
    ws['!cols'] = (sh.widths || []).map(w => ({wch: w}));
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));
  });
  XLSX.writeFile(wb, fname); toast('Excel file downloaded.', 'ok');
}
const orgRows = title => [[ORG.gov], [`${ORG.dept}, ${ORG.office}`], [title], [`Downloaded ${fmtDT(new Date())} by ${S.me.full_name}`], []];

function pdfStart(title, sub) {
  if (!needLib(window.jspdf && window.jspdf.jsPDF, 'PDF')) return null;
  const doc = new window.jspdf.jsPDF({unit: 'mm', format: 'a4'});
  if (typeof doc.autoTable !== 'function') { needLib(false, 'PDF'); return null; }
  const W = doc.internal.pageSize.getWidth();
  doc.addImage(LOGO, 'PNG', 12, 10, 21, 17.5);
  doc.setTextColor(10, 54, 38); doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.text(ORG.gov, 37, 16);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(40); doc.text(`${ORG.dept}, ${ORG.office}`, 37, 21.5);
  doc.text(`${market()} Border Market - NOC & Gate Pass Software`, 37, 26.5);
  doc.setDrawColor(10, 54, 38); doc.setLineWidth(.6); doc.line(12, 31, W - 12, 31);
  doc.setDrawColor(194, 155, 58); doc.setLineWidth(.6); doc.line(12, 31.8, 40, 31.8);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(20); doc.text(title, 12, 40);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text(sub, 12, 45.5);
  doc._y = 50; return doc;
}
function pdfSection(doc, title, head, body, opt = {}) {
  let y = doc._y + 4;
  if (y > doc.internal.pageSize.getHeight() - 30) { doc.addPage(); y = 16; }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(10, 54, 38); doc.text(title, 12, y);
  if (!body.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110); doc.text('None.', 12, y + 6); doc._y = y + 8; return; }
  doc.autoTable(Object.assign({startY: y + 2.5, head: [head], body, theme: 'grid', margin: {left: 12, right: 12},
    styles: {fontSize: 8, cellPadding: 1.6, lineColor: [205, 214, 209], lineWidth: .2, textColor: 30},
    headStyles: {fillColor: [10, 54, 38], textColor: 255, fontStyle: 'bold'}, alternateRowStyles: {fillColor: [245, 248, 246]}}, opt));
  doc._y = doc.lastAutoTable.finalY + 2;
}
function pdfSave(doc, fname) {
  const n = doc.internal.getNumberOfPages(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setDrawColor(205, 214, 209); doc.setLineWidth(.2); doc.line(12, H - 12, W - 12, H - 12);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(110);
    doc.text(`${ORG.dept}, ${ORG.gov} - downloaded ${fmtDT(new Date())}`, 12, H - 7.5);
    doc.text(`Page ${i} of ${n}`, W - 12, H - 7.5, {align: 'right'});
  }
  doc.save(fname); toast('PDF downloaded.', 'ok');
}

      ${sup ? '<button class="btn primary" id="addV">Add vendor</button>' : ''}</div>
      <div class="tbl"><table class="data cards" id="vt"><thead><tr><th>Shop #</th><th>Vendor</th><th>Firm</th><th>CNIC</th><th>Mobile</th><th class="num">This week</th><th>Weekly limit</th>${sup ? '<th></th>' : ''}</tr></thead><tbody>
      ${M.vendors.map(v => `<tr data-s="${esc((v.shop_no + ' ' + v.name + ' ' + v.firm_name + ' ' + v.cnic).toLowerCase())}" ${v.active ? '' : 'style="opacity:.55"'}>
        <td data-l="Shop #" class="nocno">${esc(v.shop_no)}</td><td data-l="Vendor">${esc(v.name)}${v.active ? '' : ' <span class="chip" style="background:var(--red-tint);color:var(--red)">Inactive</span>'}</td>
        <td data-l="Firm">${esc(v.firm_name)}</td><td data-l="CNIC">${fmtCNIC(v.cnic)}</td><td data-l="Mobile">${esc(v.mobile || '—')}</td>
        <td data-l="This week" class="num">${lim[v.id] ? lim[v.id].used_this_week : '—'}</td>
        <td data-l="Limit">${sup && v.active ? `<div class="row" style="flex-wrap:nowrap;gap:6px"><input type="number" min="0" max="100" style="width:76px" class="vl" data-id="${v.id}" value="${lim[v.id] && lim[v.id].custom_limit != null ? lim[v.id].custom_limit : ''}" placeholder="${st.export_vehicles_per_week}" aria-label="Weekly limit"><button class="btn vsv" data-id="${v.id}">Save</button></div>`
          : (lim[v.id] && lim[v.id].custom_limit != null ? lim[v.id].custom_limit : `${st.export_vehicles_per_week} (general)`)}</td>
        ${sup ? `<td><button class="btn link ved" data-id="${v.id}">Edit</button></td>` : ''}</tr>`).join('')}</tbody></table></div></section>`;
    $('#q').oninput = e => { const q = e.target.value.toLowerCase().replace(/-/g, ''); $$('#vt tbody tr').forEach(tr => tr.hidden = !tr.dataset.s.includes(q)); };
    if (sup) {
      $('#addV').onclick = () => vendorForm(null, main);
      $$('.ved').forEach(b => b.onclick = () => vendorForm(M.vendors.find(v => v.id === +b.dataset.id), main));
      $$('.vsv').forEach(b => b.onclick = async () => { const val = $(`.vl[data-id="${b.dataset.id}"]`).value.trim();
        if (await busy(b, () => rpc('app_set_vendor_limit', {p_vendor_id: +b.dataset.id, p_vehicles: val === '' ? null : +val}))) toast(val === '' ? 'Vendor uses the general limit.' : `Limit saved: ${val} per week.`, 'ok'); });
    }
  }
  if (tab === 'imp' || tab === 'exp') {
    const cat = tab === 'imp' ? 'import' : 'export', list = M.items.filter(i => i.category === cat);
    tb.innerHTML = `<section class="card flush"><div class="card-h"><h2>${cat === 'import' ? 'Import' : 'Export'} items (${list.length})</h2><span class="spacer"></span>
      ${sup ? '<button class="btn primary" id="addI">Add item</button>' : ''}</div>
      ${list.length ? `<div class="tbl"><table class="data cards"><thead><tr><th>Code</th><th>Item</th><th>Units</th><th>Status</th>${sup ? '<th></th>' : ''}</tr></thead><tbody>
      ${list.map(i => `<tr ${i.active ? '' : 'style="opacity:.55"'}><td data-l="Code" class="nocno">${esc(i.code)}</td><td data-l="Item">${esc(i.name)}</td><td data-l="Units">${i.units.map(esc).join(', ')}</td>
        <td data-l="Status">${i.active ? 'In use' : 'Not in use'}</td>${sup ? `<td><button class="btn link ied" data-id="${i.id}">Edit</button></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="empty">No items yet.</div>'}</section>`;
    if (sup) { $('#addI').onclick = () => itemForm({category: cat}, main, tab); $$('.ied').forEach(b => b.onclick = () => itemForm(M.items.find(i => i.id === +b.dataset.id), main, tab)); }
  }
  if (tab === 'importers') {
    tb.innerHTML = `<section class="card flush"><div class="card-h"><input type="search" id="q" placeholder="Search name or CNIC" style="max-width:340px"></div>
      <p class="small muted" style="margin:-4px 20px 10px">Importers are added automatically when Customs enters them. A custom weekly limit overrides the general limit (${st.import_vehicles_per_week}).</p>
      ${L.importers.length ? `<div class="tbl"><table class="data cards" id="it"><thead><tr><th>Importer</th><th>Father's name</th><th>CNIC</th><th>Address / tehsil</th><th class="num">This week</th><th>Weekly limit</th></tr></thead><tbody>
      ${L.importers.map(i => `<tr data-s="${esc((i.name + ' ' + i.cnic).toLowerCase())}"><td data-l="Importer">${esc(i.name)}</td><td data-l="Father">${esc(i.father_name || '—')}</td><td data-l="CNIC">${fmtCNIC(i.cnic)}</td>
        <td data-l="Address">${esc(i.address || '—')}</td><td data-l="This week" class="num">${i.used_this_week}</td>
        <td data-l="Limit">${sup ? `<div class="row" style="flex-wrap:nowrap;gap:6px"><input type="number" min="0" max="100" style="width:76px" class="il" data-c="${i.cnic}" value="${i.custom_limit ?? ''}" placeholder="${st.import_vehicles_per_week}" aria-label="Weekly limit"><button class="btn isv" data-c="${i.cnic}">Save</button></div>` : (i.custom_limit ?? `${st.import_vehicles_per_week} (general)`)}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">No importers yet.</div>'}</section>`;
    $('#q').oninput = e => { const q = e.target.value.toLowerCase().replace(/-/g, ''); $$('#it tbody tr').forEach(tr => tr.hidden = !tr.dataset.s.includes(q)); };
    $$('.isv').forEach(b => b.onclick = async () => { const val = $(`.il[data-c="${b.dataset.c}"]`).value.trim();
      if (await busy(b, () => rpc('app_set_importer_limit', {p_cnic: b.dataset.c, p_vehicles: val === '' ? null : +val}))) toast('Importer limit saved.', 'ok'); });
  }
};
function vendorForm(v, main) {
  v = v || {active: true};
  modal(`<div class="sheet sm"><div class="sheet-head"><h2>${v.id ? 'Edit vendor' : 'Add export vendor'}</h2><button class="x" id="cx">&times;</button></div>
    <form id="vf"><div class="sheet-body"><div class="g2">
      <div class="field"><label class="f" for="a1">Shop #</label><input type="text" id="a1" value="${esc(v.shop_no || '')}"></div>
      <div class="field"><label class="f" for="a4">CNIC</label><input type="text" id="a4" inputmode="numeric" value="${v.cnic ? fmtCNIC(v.cnic) : ''}" placeholder="00000-0000000-0"></div>
      <div class="field"><label class="f" for="a2">Vendor name</label><input type="text" id="a2" value="${esc(v.name || '')}"></div>
      <div class="field"><label class="f" for="a3">Firm name</label><input type="text" id="a3" value="${esc(v.firm_name || '')}"></div>
      <div class="field"><label class="f" for="a5">Mobile</label><input type="text" id="a5" value="${esc(v.mobile || '')}"></div>
      <div class="field"><label class="f" for="a6">Status</label><select id="a6"><option value="true">Active</option><option value="false" ${v.active ? '' : 'selected'}>Inactive</option></select></div>
    </div></div><div class="sheet-foot"><div class="row"><button class="btn primary" id="vs">Save vendor</button><span class="spacer"></span><button type="button" class="btn" id="vc">Close</button></div></div></form></div>`);
  cnicInput($('#a4')); $('#cx').onclick = $('#vc').onclick = closeModal;
  $('#vf').onsubmit = async e => { e.preventDefault();
    const r = await busy($('#vs'), () => rpc('app_save_vendor', {p: {id: v.id || null, shop_no: $('#a1').value, name: $('#a2').value, firm_name: $('#a3').value, cnic: digits($('#a4').value), mobile: $('#a5').value, active: $('#a6').value === 'true'}}));
    if (r) { closeModal(); toast('Vendor saved.', 'ok'); S.lk = await rpc('app_lookups'); V.lists(main, {tab: 'vendors'}); } };
}
function itemForm(it, main, tab) {
  modal(`<div class="sheet sm"><div class="sheet-head"><h2>${it.id ? 'Edit item' : 'Add item'}</h2><button class="x" id="cx">&times;</button></div>
    <form id="itf"><div class="sheet-body"><div class="g2">
      <div class="field"><label class="f" for="b1">Item code</label><input type="text" id="b1" value="${esc(it.code || '')}"></div>
      <div class="field"><label class="f" for="b3">List</label><select id="b3"><option value="import">Import</option><option value="export" ${it.category === 'export' ? 'selected' : ''}>Export</option></select></div>
      <div class="field span2"><label class="f" for="b2">Item name</label><input type="text" id="b2" value="${esc(it.name || '')}"></div>
      <div class="field span2"><label class="f" for="b4">Units</label><input type="text" id="b4" value="${esc((it.units || []).join(', '))}" placeholder="KG, Bag, Ton"><div class="hint">Separate units with commas.</div></div>
      <div class="field"><label class="f" for="b5">Status</label><select id="b5"><option value="true">In use</option><option value="false" ${it.active === false ? 'selected' : ''}>Not in use</option></select></div>
    </div></div><div class="sheet-foot"><div class="row"><button class="btn primary" id="is">Save item</button><span class="spacer"></span><button type="button" class="btn" id="ic2">Close</button></div></div></form></div>`);
  $('#cx').onclick = $('#ic2').onclick = closeModal;
  $('#itf').onsubmit = async e => { e.preventDefault();
    const r = await busy($('#is'), () => rpc('app_save_item', {p: {id: it.id || null, code: $('#b1').value, name: $('#b2').value, category: $('#b3').value, units: $('#b4').value, active: $('#b5').value === 'true'}}));
    if (r) { closeModal(); toast('Item saved.', 'ok'); S.lk = await rpc('app_lookups'); V.lists(main, {tab}); } };
}

/* =====================================================================
   ACTIVITY LOG / PASSWORD
   ===================================================================== */
V.audit = async main => {
  const t = todayPK();
  main.innerHTML = head('Activity log', 'Every action in the system. This record cannot be changed or deleted.') + `
  <section class="card flush"><form class="filters" id="af">
    <div class="field"><label class="f" for="a1">From</label><input type="date" id="a1" value="${addDays(t, -6)}"></div>
    <div class="field"><label class="f" for="a2">To</label><input type="date" id="a2" value="${t}"></div>
    <div class="field"><button class="btn primary wide">Show</button></div></form><div id="ao"></div></section>`;
  const det = d => Object.entries(d || {}).filter(([k, v]) => v !== null && v !== '' && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `${esc(k.replace(/_/g, ' '))}: ${esc(Array.isArray(v) ? v.join(' → ') : typeof v === 'object' ? JSON.stringify(v) : v)}`).join('<br>');
  const load = async () => {
    $('#ao').innerHTML = '<div class="empty"><span class="spin"></span></div>';
    try { const rows = await rpc('app_audit', {p_from: $('#a1').value, p_to: $('#a2').value, p_limit: 2000});
      $('#ao').innerHTML = rows.length ? `<div class="tbl"><table class="data cards"><thead><tr><th>Time</th><th>By</th><th>Action</th><th>NOC</th><th>Details</th></tr></thead><tbody>
        ${rows.map(a => `<tr><td data-l="Time">${fmtDT(a.at)}</td><td data-l="By">${esc(a.by || '—')} <span class="small muted">(${esc(ROLE[a.role] || a.role)})</span></td>
        <td data-l="Action">${esc(ACTION[a.action] || a.action)}</td><td data-l="NOC" class="nocno">${esc(a.noc_no || '—')}</td><td data-l="Details" class="small">${det(a.details) || '—'}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty">No activity in this period.</div>';
    } catch (e) { $('#ao').innerHTML = `<div class="note bad" style="margin:16px">${esc(e.message)}</div>`; }
  };
  $('#af').onsubmit = e => { e.preventDefault(); load(); }; load();
};
V.password = async main => {
  main.innerHTML = head('Change password', 'At least 10 characters, with a capital letter, a small letter, a number and a symbol.') + `
  <section class="card" style="max-width:480px"><form id="pf">
    <div class="field"><label class="f" for="p1">New password</label><input type="password" id="p1" autocomplete="new-password"></div>
    <div class="field"><label class="f" for="p2">Type it again</label><input type="password" id="p2" autocomplete="new-password"></div>
    <button class="btn primary">Change password</button></form></section>`;
  $('#pf').onsubmit = async e => {
    e.preventDefault(); const p = $('#p1').value;
    if (p.length < 10 || !/[A-Z]/.test(p) || !/[a-z]/.test(p) || !/\d/.test(p) || !/[^A-Za-z0-9]/.test(p)) { toast('Use 10+ characters with a capital, a small letter, a number and a symbol.', 'err'); return; }
    if (p !== $('#p2').value) { toast('The two passwords do not match.', 'err'); return; }
    const {error} = await sb.auth.updateUser({password: p});
    if (error) { toast(error.message, 'err'); return; }
    toast('Password changed.', 'ok'); $('#pf').reset();
  };
};

start();
</script>
